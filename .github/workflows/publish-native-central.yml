name: Publish Skiko Native to Maven Central

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

concurrency:
  group: publish-skiko-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must be a Maven version such as 0.152.0 or v0.152.0" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x64 and arm64
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: Check out tag

      - uses: ./.github/actions/setup-prerequisites
        name: Set up prerequisites

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          keyring="$gradle_dir/skiko-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$gradle_dir/gradle.properties"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | base64 --decode > "$keyring"
          test -s "$keyring"
          printf '\nsigning.secretKeyRingFile=/gradle-cache/skiko-secret-key.gpg\n' >> "$gradle_dir/gradle.properties"
          chmod 600 "$gradle_dir/gradle.properties" "$keyring"

      - uses: ./.github/actions/docker-skiko-run
        name: Build signed Linux publications
        with:
          image_name: linux-amd64
          command: |
            ./gradlew -p skiko --no-daemon --stacktrace --no-configuration-cache \
              -Pdeploy.release=true \
              -Pdeploy.version=${{ needs.prepare.outputs.version }} \
              -Pskiko.awt.enabled=true \
              -Pskiko.native.root.only=true \
              -Pskiko.native.linux.x64.enabled=true \
              -Pskiko.native.linux.arm64.enabled=true \
              -Pskiko.native.windows.enabled=true \
              :publishKotlinMultiplatformPublicationToBuildRepoRepository \
              :publishLinuxX64PublicationToBuildRepoRepository \
              :publishLinuxArm64PublicationToBuildRepoRepository

      - uses: actions/upload-artifact@v4
        name: Upload Linux Maven repository
        with:
          name: skiko-native-repo-linux-${{ needs.prepare.outputs.version }}
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 5

  windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Check out tag

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          java-version: '21'
          distribution: corretto

      - uses: ./.github/actions/setup-prerequisites
        name: Set up prerequisites

      - name: Restore Gradle properties and signing key
        shell: pwsh
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GRADLE_PROPERTIES_CONTENT)) {
            throw 'GRADLE_PROPERTIES is empty'
          }
          if ([string]::IsNullOrWhiteSpace($env:GPG_SECRET_KEY_RING_BASE64)) {
            throw 'GPG_SECRET_KEY_RING_BASE64 is empty'
          }
          $gradleDir = Join-Path $HOME '.gradle'
          $propertiesFile = Join-Path $gradleDir 'gradle.properties'
          $keyring = Join-Path $gradleDir 'skiko-secret-key.gpg'
          New-Item -ItemType Directory -Force -Path $gradleDir | Out-Null
          [IO.File]::WriteAllText($propertiesFile, $env:GRADLE_PROPERTIES_CONTENT)
          $encodedKey = $env:GPG_SECRET_KEY_RING_BASE64 -replace '\s', ''
          [IO.File]::WriteAllBytes($keyring, [Convert]::FromBase64String($encodedKey))
          if ((Get-Item -LiteralPath $keyring).Length -eq 0) {
            throw 'Decoded signing key is empty'
          }
          $gradleKeyring = $keyring.Replace('\', '/')
          [IO.File]::AppendAllText($propertiesFile, "`nsigning.secretKeyRingFile=$gradleKeyring`n")

      - name: Build signed Windows publication
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p skiko --no-daemon --stacktrace --no-configuration-cache \
            -Pdeploy.release=true \
            -Pdeploy.version=${{ needs.prepare.outputs.version }} \
            -Pskiko.awt.enabled=false \
            -Pskiko.native.windows.enabled=true \
            :publishMingwX64PublicationToBuildRepoRepository

      - uses: actions/upload-artifact@v4
        name: Upload Windows Maven repository
        with:
          name: skiko-native-repo-windows-${{ needs.prepare.outputs.version }}
          path: skiko/build/repo
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish merged repository
    needs:
      - prepare
      - linux
      - windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: Check out tag

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          java-version: '21'
          distribution: corretto

      - uses: ./.github/actions/setup-prerequisites
        name: Set up prerequisites

      - uses: actions/download-artifact@v4
        name: Merge platform Maven repositories
        with:
          pattern: skiko-native-repo-*-${{ needs.prepare.outputs.version }}
          path: skiko/build/repo
          merge-multiple: true

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          keyring="$gradle_dir/skiko-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$gradle_dir/gradle.properties"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | base64 --decode > "$keyring"
          test -s "$keyring"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$gradle_dir/gradle.properties"
          chmod 600 "$gradle_dir/gradle.properties" "$keyring"

      - name: Verify collected publications
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          group_path='dev/brahmkshatriya/skiko'
          for module in skiko skiko-linuxx64 skiko-linuxarm64 skiko-mingwx64; do
            module_dir="skiko/build/repo/$group_path/$module/$RELEASE_VERSION"
            test -d "$module_dir"
            test -s "$module_dir/$module-$RELEASE_VERSION.pom"
            test -s "$module_dir/$module-$RELEASE_VERSION.pom.asc"
            test -s "$module_dir/$module-$RELEASE_VERSION.module"
            test -s "$module_dir/$module-$RELEASE_VERSION.module.asc"
            if [[ "$module" == skiko ]]; then
              test -s "$module_dir/$module-$RELEASE_VERSION.jar"
              test -s "$module_dir/$module-$RELEASE_VERSION.jar.asc"
            else
              test -s "$module_dir/$module-$RELEASE_VERSION.klib"
              test -s "$module_dir/$module-$RELEASE_VERSION.klib.asc"
            fi
          done
          root_module="skiko/build/repo/$group_path/skiko/$RELEASE_VERSION/skiko-$RELEASE_VERSION.module"
          expected_targets=$'linux_arm64\nlinux_x64\nmingw_x64'
          actual_targets="$(jq -r '.variants[].attributes["org.jetbrains.kotlin.native.target"] // empty' "$root_module" | sort -u)"
          test "$actual_targets" = "$expected_targets"
          test "$(jq '[.variants[] | select(.name | startswith("awt"))] | length' "$root_module")" -eq 0
          for module in skiko-linuxx64 skiko-linuxarm64 skiko-mingwx64; do
            test "$(jq --arg module "$module" '[.variants[] | select(."available-at".module == $module)] | length' "$root_module")" -gt 0
          done
          windows_dir="skiko/build/repo/$group_path/skiko-mingwx64/$RELEASE_VERSION"
          test -s "$windows_dir/skiko-mingwx64-$RELEASE_VERSION-icudtl.dat"
          test -s "$windows_dir/skiko-mingwx64-$RELEASE_VERSION-icudtl.dat.asc"

      - name: Upload and publish on Maven Central
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          properties_file="$HOME/.gradle/gradle.properties"
          export MAVEN_CENTRAL_USER="$(sed -n 's/^mavenCentralUsername=//p' "$properties_file" | tail -n1 | tr -d '\r')"
          export MAVEN_CENTRAL_PASSWORD="$(sed -n 's/^mavenCentralPassword=//p' "$properties_file" | tail -n1 | tr -d '\r')"
          test -n "$MAVEN_CENTRAL_USER"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          ./gradlew -p skiko --no-daemon --stacktrace --no-configuration-cache \
            -Pdeploy.release=true \
            -Pdeploy.version="$RELEASE_VERSION" \
            :ci:uploadDesktopNativeSkikoArtifactsToMavenCentral
